# Netlify build config: runs build.js, publishes public/

[build]
# 🔧 Build command for the static site; version.json reports what is deployed
command = "node build.js && node tools/version.js public"

# 📦 Output directory for built files
publish = "public"

# 🧪 Environment configuration
environment = { NODE_VERSION = "26" }

[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
