<!-- Fallback page served for unknown paths -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/media/logo.svg" />
    <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />
    <meta name="robots" content="noindex" />
    <title>Page not found</title>

    <script src="/scripts/theme-init.js"></script>

    <!-- EXTERNAL_RESOURCES -->

    <link rel="stylesheet" href="/styles.css" />
    <script src="/scripts.js" defer></script>
  </head>
  <body class="page-shell" data-nav-page="">
    <a class="skip-link" href="#main">Skip to content</a>
    <drop capsule="gradient-background" data-animated="true"></drop>

    <header class="container nav-center">
      <drop capsule="header">
        <li class="nav-pill__item">
          <a href="/" class="nav-pill__link" aria-label="Home" data-nav="home">
            <i class="ri-home-5-line" aria-hidden="true"></i>
            <span class="nav-pill__text">Home</span>
          </a>
        </li>
        <li class="nav-pill__item">
          <a
            href="/#capsules"
            class="nav-pill__link"
            aria-label="Capsules"
            data-nav="capsules"
          >
            <i class="ri-capsule-line" aria-hidden="true"></i>
            <span class="nav-pill__text">Capsules</span>
          </a>
        </li>
        <li class="nav-pill__item">
          <a
            href="https://github.com/AnalogCyan/GachaKit#readme"
            class="nav-pill__link"
            aria-label="Docs"
            data-nav="docs"
          >
            <i class="ri-book-open-line" aria-hidden="true"></i>
            <span class="nav-pill__text">Docs</span>
          </a>
        </li>
      </drop>
    </header>

    <main class="container" id="main">
      <section class="glass section-card showcase-hero">
        <h1 class="showcase-title">404</h1>
        <p class="showcase-lead">
          That page does not exist. It may have been renamed, or it may never
          have been dispensed in the first place.
        </p>
        <nav class="button-group" aria-label="Recover">
          <a
            class="button secondary button-group__item button-group__item--first button-group__item--last"
            href="/"
          >
            <i class="ri-home-5-line" aria-hidden="true"></i>
            <span>Back home</span>
          </a>
        </nav>
      </section>
    </main>

    <drop capsule="footer">
      <p>
        &copy; 2024-2026 GachaKit. Built with softness, structure, and a hint of
        shimmer.
      </p>
    </drop>
  </body>
</html>
